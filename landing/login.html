<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cooperativa Vista Linda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

        body {
            background: linear-gradient(135deg, #05668d 0%, #0a4a6e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Montserrat", sans-serif;
        }
    </style>
   
</head>
<body>
    <div class="w-full max-w-5xl mx-auto px-4">
        <div class="grid md:grid-cols-2 gap-8 items-center">
            <!-- Lado izquierdo - Título -->
            <div class="text-center md:text-left">
                <h1 class="text-white text-5xl md:text-6xl font-bold mb-4">
                    Cooperativa<br>
                    <span class="text-[#679436]">VISTA LINDA</span>
                </h1>
            </div>

            <!-- Lado derecho - Formulario -->
            <div class="bg-gray-200 rounded-lg p-8 shadow-2xl">
                <h2 class="text-2xl font-bold text-[#05668d] mb-6 text-center">INICIAR SESIÓN</h2>
                
                <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                    <span id="error-text"></span>
                </div>

                <div id="success-message" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
                    <span id="success-text"></span>
                </div>

                <form id="login-form" class="space-y-4">
                    <div>
                        <input 
                            type="text" 
                            id="ci" 
                            name="ci" 
                            placeholder="Cédula"
                            required
                            class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:border-[#05668d] focus:outline-none"
                        >
                    </div>

                    <div>
                        <input 
                            type="password" 
                            id="contrasena" 
                            name="contrasena" 
                            placeholder="Contraseña"
                            required
                            class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:border-[#05668d] focus:outline-none"
                        >
                    </div>

                    <button 
                        type="submit"
                        class="w-full bg-[#05668d] hover:bg-[#044a6e] text-white font-bold py-3 px-6 rounded-lg transition duration-300 border-2 border-white"
                    >
                        Ingresar
                    </button>
                </form>

                <div class="mt-6 text-center space-y-2">
                    <a href="index.html" class="block text-gray-700 hover:text-[#05668d] transition">
                        Volver al inicio
                    </a>
                    <a href="registro.html" class="block text-[#05668d] hover:text-[#679436] font-semibold transition">
                        ¡Quiero registrarme!
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const successMessage = document.getElementById('success-message');
        const successText = document.getElementById('success-text');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');

            const ci = document.getElementById('ci').value.trim();
            const contrasena = document.getElementById('contrasena').value;

            if (!ci || !contrasena) {
                showError('Por favor complete todos los campos');
                return;
            }

            try {
                const formData = new FormData();
                formData.append('ci', ci);
                formData.append('contrasena', contrasena);

                const response = await fetch('../../api_usuarios/login.php', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('¡Login exitoso! Redirigiendo...');
                    
                    setTimeout(() => {
                        if (data.tipo_usuario === 'socio') {
                            if (data.perfil_completo == 0) {
                                window.location.href = '../cooperativa/pago_inicial.html';
                            } else {
                                window.location.href = '../cooperativa/dashboard.html';
                            }
                        } else if (data.tipo_usuario === 'admin') {
                            window.location.href = '../../Backoffice/vista/admin_dashboard.html';
                        }
                    }, 1000);
                } else {
                    showError(data.message || 'Error al iniciar sesión');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Error de conexión. Intente nuevamente.');
            }
        });

        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        function showSuccess(message) {
            successText.textContent = message;
            successMessage.classList.remove('hidden');
        }
    </script>
</body>
</html>
