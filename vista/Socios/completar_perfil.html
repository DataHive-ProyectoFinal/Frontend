<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completar Perfil</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-900 text-gray-100 min-h-screen flex flex-col justify-center items-center">

  <div class="bg-gray-800 rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <h1 class="text-3xl font-bold text-center mb-6 text-blue-300">Completar Perfil</h1>

    <form id="formPerfil" class="space-y-4">
      <input type="hidden" id="ci" name="ci">

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required
               class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white focus:ring-2 focus:ring-blue-400 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
        <input type="email" id="email" name="email" required
               class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white focus:ring-2 focus:ring-blue-400 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Teléfono</label>
        <input type="text" id="telefono" name="telefono" required
               class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white focus:ring-2 focus:ring-blue-400 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Nueva contraseña</label>
        <input type="password" id="password" name="password" required
               class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white focus:ring-2 focus:ring-blue-400 focus:outline-none">
      </div>

      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded-lg transition">
        Guardar Cambios
      </button>
    </form>

    <p id="mensaje" class="mt-4 text-center text-sm text-blue-300"></p>
  </div>

  <script>
    // Recuperar la CI del localStorage (guardada desde loginController)
    const ci = localStorage.getItem('ci_usuario');
    if (!ci) {
      window.location.href = "../login.html";
    } else {
      document.getElementById('ci').value = ci;
    }

    // Envío del formulario
        document.getElementById('formPerfil').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const respuesta = await fetch('../../api_usuarios/controlador/completar_perfil.php', {
            method: 'POST',
            body: formData
        });

        const data = await respuesta.json();

        const msg = document.getElementById('mensaje');
        msg.textContent = data.msg;

        if (data.success) {
            msg.classList.add('text-green-400');
            // Redirigir al home de socios después de guardar
            setTimeout(() => {
            window.location.href = "../../vista/Socios/home-frontend-socios.html";
            }, 1500);
        } else {
            msg.classList.add('text-red-400');
        }
        });

  </script>

</body>
</html>
