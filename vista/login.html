<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>


  <section class="content">

    <div class="img">
      <h1>Cooperativa <br><span>Vista linda</span> </h1>
    </div>

    <div class="form">
      <h2>Iniciar sesión</h2>
        <form id="formLogin" class="form-content">
        <input type="text" name="ci_usuario" placeholder="Cédula" required><br>
        <input type="password" name="password" placeholder="Contraseña" required><br>
        <button type="submit">Ingresar</button>
      </form>
      <div class="links">
         <a href="../landingPage/Home.html">Volver al inicio</a> <br>
        <a href="../landingPage/registro.html">Quiero registrarme!</a>
      </div>
     
    </div>
    
  </section>
  

  <script>
  document.getElementById("formLogin").addEventListener("submit", async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);

    try {
      const res = await fetch("http://localhost/Proyecto-DataHive-EntregaFinal/api_usuarios/controlador/loginController.php", {
        method: "POST",
        body: formData
      });

      const text = await res.text();
      console.log("Respuesta del servidor:", text);

      let data;
      try {
        data = JSON.parse(text);
      } catch (err) {
        alert("El servidor no devolvió JSON válido o hubo un error");
        return;
      }

      if (data.success) {
        sessionStorage.setItem("ci_usuario", data.ci);
        sessionStorage.setItem("rol", data.rol);

        if (data.rol === "socio") {
          window.location.href = "../vista/Socios/home-frontend-socios.html";
        } else if (data.rol === "admin") {
          window.location.href = "../vista/Backoffice/home-backoffice.html";
        }
      } else {
        alert(data.msg || "Credenciales incorrectas");
      }
    } catch (err) {
      alert("Error en el servidor o ruta incorrecta");
    }
  });
  </script>
</body>
</html>
