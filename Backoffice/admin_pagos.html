                    <th class="border border-gray-300 px-4 py-2">Cédula</th>
                    <th class="border border-gray-300 px-4 py-2">Monto</th>
                    <th class="border border-gray-300 px-4 py-2">Tipo</th>
                    <th class="border border-gray-300 px-4 py-2">Comprobante</th>
                    <th class="border border-gray-300 px-4 py-2">Fecha</th>
                    <th class="border border-gray-300 px-4 py-2">Estado</th>
                  </tr>
                </thead>
                <tbody id="tablaPagos"></tbody>
              </table>

            <script>
            async function cargarPagos() {
              try {
                const res = await fetch("http://localhost/Proyecto-DataHive-primeraEntrega/api_cooperativa/pagos/listar_pagos.php");
                const data = await res.json();

                const tabla = document.getElementById("tablaPagos");
                tabla.innerHTML = "";

                if (!data || data.length === 0) {
                  tabla.innerHTML = `<tr><td colspan="7" class="text-center p-4">No hay pagos registrados</td></tr>`;
                  return;
                }

                data.forEach(pago => {
                  tabla.innerHTML += `
                    <tr>
                      <td class="border border-gray-300 px-4 py-2">${pago.id_pago}</td>
                      <td class="border border-gray-300 px-4 py-2">${pago.ci_usuario}</td>
                      <td class="border border-gray-300 px-4 py-2">$${pago.monto}</td>
                      <td class="border border-gray-300 px-4 py-2">${pago.tipo}</td>
                      <td class="border border-gray-300 px-4 py-2">
                        <a href="../../api_cooperativa/${pago.comprobante}" target="_blank" class="text-blue-600 underline">Ver</a>
                      </td>
                      <td class="border border-gray-300 px-4 py-2">${pago.fecha}</td>
                      <td class="border border-gray-300 px-4 py-2">
                        <span class="font-medium">${pago.estado}</span>
                        <div class="flex gap-2 mt-2">
                          <button onclick="actualizarEstado(${pago.id_pago}, 'verificado')" class="px-2 py-1 bg-green-500 text-white rounded"> Verificar</button>
                          <button onclick="actualizarEstado(${pago.id_pago}, 'rechazado')" class="px-2 py-1 bg-red-500 text-white rounded"> Rechazar</button>
                        </div>
                      </td>
                    </tr>
                  `;
                });
              } catch (err) {
                console.error("Error al cargar pagos:", err);
              }
            }

            async function actualizarEstado(id_pago, nuevoEstado) {
              try {
                const res = await fetch("http://localhost/Proyecto-DataHive-primeraEntrega/api_cooperativa/pagos/actualizar_estado.php", {
                  method: "POST",
                  headers: { "Content-Type": "application/x-www-form-urlencoded" },
                  body: `id_pago=${id_pago}&estado=${nuevoEstado}`
                });

                const data = await res.text();
                alert(data);
                cargarPagos(); // refresca la tabla
              } catch (err) {
                console.error("Error:", err);
              }
            }

            // cargar los pagos al abrir la página
            cargarPagos();
            </script>
